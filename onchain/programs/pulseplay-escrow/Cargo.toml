[package]
name = "pulseplay-escrow"
version = "0.1.0"
description = "PulsePlay Markets: three market categories settled trustlessly by CPI into the TxLINE oracle."
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "pulseplay_escrow"

[features]
default = []
# Pin settlement's trusted oracle to the devnet TxLINE program instead of mainnet.
devnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", default-features = false, features = ["token", "associated_token", "token_2022"] }
txoracle-cpi = { path = "../../crates/txoracle-cpi" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
